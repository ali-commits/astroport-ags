[package]
name = "astroport-adapter"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "AGS extension adapter (protocol 2) for AstroPort"

[[bin]]
name = "astroport-adapter"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
toml = "0.8"
tempfile = "3"

[profile.release]
opt-level = 2
