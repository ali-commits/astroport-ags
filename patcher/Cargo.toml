[package]
name = "astro-patcher"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "LD_PRELOAD library that applies KytyPS5-style memory cheats to an AnyPS5-relinked game"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 2
