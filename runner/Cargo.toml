[package]
name = "astroport-run"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Builds the AstroPort run folder from the user's own Astro Bot dump (AGS extension job)"

[lib]
name = "astroport_run"

[[bin]]
name = "astroport-run"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
